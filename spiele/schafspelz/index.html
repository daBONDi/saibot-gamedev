<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wolf im Schafspelz</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(160deg, #1b1f3a, #3a1f5c);
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.5rem;
      box-sizing: border-box;
      touch-action: manipulation;
    }
    .leiste {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 960px;
      margin-bottom: 0.4rem;
    }
    a { color: #ffd166; }
    button {
      background: #ffd166;
      color: #1b1f3a;
      border: none;
      border-radius: 0.6rem;
      padding: 0.35rem 0.8rem;
      font: bold 0.95rem system-ui, sans-serif;
      cursor: pointer;
    }
    /* Die Bühne: das Spielbild, darüber Multiplayer-Fenster und Chat */
    #buehne {
      position: relative;
      /* So groß wie möglich, aber es muss auch in der Höhe aufs Handy passen */
      width: min(100%, 960px, calc((100vh - 3.5rem) * 1.6));
      width: min(100%, 960px, calc((100dvh - 3.5rem) * 1.6));
      aspect-ratio: 960 / 600;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 1rem;
      box-shadow: 0 0 30px #6fe3ff55;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      background: #000;
    }
    /* Vollbild: nur noch das Spiel */
    html:fullscreen body { padding: 0; justify-content: center; }
    html:fullscreen .leiste { display: none; }
    html:fullscreen #buehne { width: min(100vw, calc(100vh * 1.6)); }
    html:fullscreen canvas { border-radius: 0; }

    /* 🌐 Multiplayer-Fenster (nur auf dem Titelbild) */
    #mp-box {
      position: absolute;
      top: 2%;
      right: 1.5%;
      width: 15rem;
      max-width: 40%;
      padding: 0.6rem;
      border-radius: 0.8rem;
      background: #1b1f3aee;
      border: 1px solid #ffd16688;
      font-size: 0.85rem;
      line-height: 1.5;
      z-index: 2;
    }
    #mp-zeile { display: flex; gap: 0.35rem; }
    #mp-code {
      width: 5rem;
      min-width: 0;
      flex: 1;
      padding: 0.3rem;
      border-radius: 0.5rem;
      border: 1px solid #ffd166;
      background: #0d0f1f;
      color: #fff;
      font: bold 1rem monospace;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      text-align: center;
    }
    #mp-oder { color: #a9a3d9; font-size: 0.75rem; text-align: center; }
    #mp-status { color: #ffd166; font-size: 0.8rem; margin-top: 0.3rem; }
    #mp-liste { margin-top: 0.3rem; font-weight: bold; }

    /* 💬 Chat (unten links über dem Spiel) */
    #chat {
      position: absolute;
      left: 1%;
      bottom: 2%;
      width: 34%;
      max-height: 45%;
      display: none;
      flex-direction: column;
      gap: 0.25rem;
      z-index: 2;
      pointer-events: none;   /* Klicks gehen durch die Nachrichten durch aufs Spiel */
    }
    #chat-liste {
      overflow-y: auto;
      font-size: 0.8rem;
      line-height: 1.35;
      text-shadow: 0 1px 2px #000, 0 0 3px #000;
      scrollbar-width: none;
    }
    .chat-zeile { background: #1b1f3a99; border-radius: 0.4rem; padding: 0.1rem 0.4rem; margin-top: 0.15rem; word-wrap: break-word; }
    .chat-zeile.geist { background: #4a3a7a99; font-style: italic; }
    #chat-unten { display: flex; gap: 0.3rem; pointer-events: auto; }
    #chat-eingabe {
      display: none;
      flex: 1;
      min-width: 0;
      padding: 0.35rem 0.5rem;
      border-radius: 0.5rem;
      border: 1px solid #ffd166;
      background: #0d0f1fee;
      color: #fff;
      font: 0.85rem system-ui, sans-serif;
    }
    #chat-knopf { padding: 0.25rem 0.5rem; font-size: 0.85rem; }

    /* Hinweis: Handy quer halten */
    #drehen {
      display: none;
      position: fixed;
      inset: 0;
      background: #1b1f3add;
      font-size: 1.4rem;
      text-align: center;
      padding: 40vh 1rem 0;
    }
    @media (orientation: portrait) and (pointer: coarse) {
      #drehen { display: block; }
    }
  </style>
</head>
<body>
  <div class="leiste">
    <a href="../../">← Zur Übersicht</a>
    <button id="vollbild">⛶ Vollbild</button>
  </div>
  <div id="buehne">
    <canvas id="spiel" width="960" height="600"></canvas>
    <div id="mp-box">
      <b>🌐 Mit Freunden spielen</b><br>
      <button id="mp-erstellen">🏠 Raum erstellen</button>
      <div id="mp-oder">– oder Code eingeben –</div>
      <div id="mp-zeile">
        <input id="mp-code" maxlength="4" placeholder="CODE" autocomplete="off" spellcheck="false">
        <button id="mp-beitreten">🔑 Los!</button>
      </div>
      <div id="mp-status"></div>
      <div id="mp-liste"></div>
    </div>
    <div id="chat">
      <div id="chat-liste"></div>
      <div id="chat-unten">
        <button id="chat-knopf" title="Chat (T)">💬</button>
        <input id="chat-eingabe" maxlength="100" placeholder="Nachricht … (Enter = senden)" autocomplete="off">
      </div>
    </div>
  </div>
  <div id="drehen">📱↻<br>Dreh dein Handy quer!</div>
  <script>
    // Vollbild-Knopf (geht nicht auf jedem Handy, z. B. nicht auf dem iPhone)
    const vollbild = document.getElementById('vollbild');
    if (!document.documentElement.requestFullscreen) vollbild.style.display = 'none';
    vollbild.addEventListener('click', async () => {
      try {
        await document.documentElement.requestFullscreen();
        await screen.orientation.lock('landscape');
      } catch (e) { /* egal, dann eben nicht */ }
    });
  </script>
  <script src="karten.js"></script>
  <script src="spiel.js?v=2"></script>
</body>
</html>
