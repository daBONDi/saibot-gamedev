<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kämpfer aus Stahl</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(160deg, #14161c, #2b3140);
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.5rem;
      box-sizing: border-box;
    }
    .leiste {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1280px;
      margin-bottom: 0.4rem;
    }
    a { color: #ffd166; }
    button {
      background: #ffd166;
      color: #1b1f3a;
      border: none;
      border-radius: 0.6rem;
      padding: 0.35rem 0.8rem;
      font: bold 0.95rem system-ui, sans-serif;
      cursor: pointer;
    }
    /* Die Bühne: hinten das 3D-Bild, vorne die Anzeigen (HUD) */
    #buehne {
      position: relative;
      width: min(100%, 1280px, calc((100vh - 3.5rem) * 1.6));
      width: min(100%, 1280px, calc((100dvh - 3.5rem) * 1.6));
      aspect-ratio: 960 / 600;
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 0 30px #93c5fd55;
      background: #000;
      user-select: none;
      -webkit-user-select: none;
    }
    #buehne canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;   /* Auf dem Handy: nicht scrollen oder zoomen, wenn man im Spiel wischt */
    }
    /* Vollbild: nur noch das Spiel */
    html:fullscreen body { padding: 0; justify-content: center; }
    html:fullscreen .leiste { display: none; }
    html:fullscreen #buehne { width: min(100vw, calc(100vh * 1.6)); border-radius: 0; }
  </style>
</head>
<body>
  <div class="leiste">
    <a href="../../">← Zur Übersicht</a>
    <button id="vollbild">⛶ Vollbild</button>
  </div>
  <div id="buehne">
    <canvas id="spiel" width="960" height="600"></canvas>
  </div>
  <script>
    // Vollbild-Knopf
    const vollbild = document.getElementById('vollbild');
    if (!document.documentElement.requestFullscreen) vollbild.style.display = 'none';
    vollbild.addEventListener('click', async () => {
      try { await document.documentElement.requestFullscreen(); } catch (e) { /* egal, dann eben nicht */ }
    });
  </script>
  <!-- Fehler-Anzeige: Wenn etwas kaputt ist, steht es hier in einer roten Box (statt nur schwarzem Bildschirm) -->
  <div id="fehler" style="display:none; position:fixed; left:8px; right:8px; bottom:8px; background:#7f1d1d; color:#fff; padding:8px 12px; border-radius:8px; font:13px monospace; white-space:pre-wrap; z-index:10;"></div>
  <script>
    const gemeldet = new Set();
    window.zeigeFehler = (t) => {
      if (gemeldet.has(t) || gemeldet.size > 4) return;
      gemeldet.add(t);
      const box = document.getElementById('fehler');
      box.style.display = 'block';
      box.textContent += (box.textContent ? '\n' : '⚠️ Fehler (bitte Claude zeigen!):\n') + t;
    };
    addEventListener('error', e => zeigeFehler(`${e.message} (Zeile ${e.lineno})`));
    addEventListener('unhandledrejection', e => zeigeFehler(String(e.reason && e.reason.stack || e.reason).split('\n').slice(0, 2).join(' ')));
  </script>
  <!-- ?v=... ändern, damit der Browser sicher die neue Version lädt -->
  <script type="module" src="spiel.js?v=13"></script>
</body>
</html>
