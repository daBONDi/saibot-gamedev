<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farming Game</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: Arial;
    background: #7bb5d9;
}
#hud {
    position: absolute;
    top: 15px;
    left: 15px;
    color: white;
    background: #17251ddd;
    padding: 15px;
    border-radius: 10px;
    line-height: 1.7;
}
#hud h2 { margin: 0 0 6px; }
#hud a { color: #b9f5a0; }
#help {
    position: absolute;
    bottom: 15px;
    left: 15px;
    color: white;
    background: #17251ddd;
    padding: 12px;
    border-radius: 10px;
}
#hinweis {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    background: #17251ddd;
    padding: 10px 16px;
    border-radius: 10px;
    display: none;
}
button {
    padding: 9px;
    margin: 3px;
    cursor: pointer;
}
</style>
</head>
<body>

<div id="hud">
<a href="../../">← Zur Übersicht</a>
<h2>🌾 Farming Game</h2>
💶 Geld: <span id="money">250000</span> €<br>
🚜 Fahrzeug: <span id="vehicle">Fendt</span><br>
📍 Modus: <span id="mode">Fahren</span><br>
<button onclick="buildMode()">🏗️ Baumodus</button>
<button onclick="earn()">🌾 Ernte verkaufen</button>
</div>

<div id="help">
W A S D = Bewegen / Fahren<br>
Maus gedrückt halten = Kamera drehen<br>
E = Einsteigen / Aussteigen<br>
B = Baumodus (Klick = Gebäude bauen, 10.000 €)<br>
R = Gebäude drehen<br>
Leertaste = Bremsen
</div>

<div id="hinweis"></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87bce0);

const camera = new THREE.PerspectiveCamera(
    70, innerWidth/innerHeight, 0.1, 1000
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x496b35,2));

const sun = new THREE.DirectionalLight(0xffffff,2);
sun.position.set(30,60,20);
scene.add(sun);

const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(300,300),
    new THREE.MeshStandardMaterial({color:0x39843b})
);
ground.rotation.x=-Math.PI/2;
scene.add(ground);

// Feld
function field(x,z,color=0x80603a) {
    const f=new THREE.Mesh(
        new THREE.BoxGeometry(35,0.15,45),
        new THREE.MeshStandardMaterial({color})
    );
    f.position.set(x,0.08,z);
    scene.add(f);
}
field(-45,-35);
field(0,-35,0x8c7143);
field(45,-35);

// Scheune
const barn = new THREE.Mesh(
    new THREE.BoxGeometry(15,7,12),
    new THREE.MeshStandardMaterial({color:0xa83225})
);
barn.position.set(25,3.5,25);
scene.add(barn);

// Traktor (fährt nach vorne = Richtung -Z)
const tractor = new THREE.Group();
scene.add(tractor);

function cube(parent,x,y,z,sx,sy,sz,color) {
    const m=new THREE.Mesh(
        new THREE.BoxGeometry(sx,sy,sz),
        new THREE.MeshStandardMaterial({color})
    );
    m.position.set(x,y,z);
    parent.add(m);
    return m;
}

cube(tractor,0,1,0,2.3,1.1,3.5,0x16852c);
cube(tractor,0,2,0.25,1.5,1.4,1.5,0x233e39);
cube(tractor,0,2,0.25,1.3,1.2,1.3,0x83c9df);

for(let x of [-1.2,1.2]){
    for(let z of [-1.05,1.05]){
        // Repariert: Die kleinen Räder gehören nach VORNE (z < 0), die großen nach hinten
        const radius = z<0 ? 0.48 : 0.68;
        const wheel=new THREE.Mesh(
            new THREE.CylinderGeometry(radius,radius,0.4,20),
            new THREE.MeshStandardMaterial({color:0x171717})
        );
        wheel.rotation.z=Math.PI/2;
        wheel.position.set(x,radius,z);   // Repariert: Jedes Rad steht genau auf dem Boden
        tractor.add(wheel);
    }
}

tractor.position.set(0,0,10);

// Bäume
function tree(x,z){
    const trunk=new THREE.Mesh(
        new THREE.CylinderGeometry(0.35,0.5,3),
        new THREE.MeshStandardMaterial({color:0x694020})
    );
    trunk.position.set(x,1.5,z);
    scene.add(trunk);

    const crown=new THREE.Mesh(
        new THREE.SphereGeometry(2.1,12,10),
        new THREE.MeshStandardMaterial({color:0x176c28})
    );
    crown.position.set(x,4,z);
    scene.add(crown);
}
for(let i=0;i<30;i++){
    tree(Math.sin(i*5)*90,Math.cos(i*7)*90);
}

let money=250000;
let driving=true;
let building=false;
let speed=0;
let rotation=0;
let yaw=0;
let pitch=0.25;
let keys={};

const EINSTEIGEN_ABSTAND = 4;   // So nah musst du am Traktor sein, um einzusteigen

const player=new THREE.Group();
const body=cube(player,0,0.9,0,0.6,1.8,0.4,0x263caa);
scene.add(player);
player.visible=false;

const hinweis=document.getElementById('hinweis');
function zeigeHinweis(text){
    hinweis.textContent=text;
    hinweis.style.display=text?'block':'none';
}

function updateHUD(){
    document.getElementById('money').textContent=money.toLocaleString('de-DE');
    document.getElementById('mode').textContent=
        building?'Baumodus':driving?'Fahren':'Zu Fuß';
}

function earn(){
    money+=5000;
    updateHUD();
}

function buildMode(){
    building=!building;
    updateHUD();
}
window.buildMode=buildMode;
window.earn=earn;

document.addEventListener('keydown',e=>{
    keys[e.key.toLowerCase()]=true;
    if(e.repeat) return;   // Repariert: Gedrückt halten soll nicht ständig ein- und aussteigen

    if(e.key.toLowerCase()==='e'){
        if(driving){
            // Aussteigen: neben den Traktor stellen und in dieselbe Richtung schauen
            driving=false;
            speed=0;
            yaw=tractor.rotation.y;
            player.position.copy(tractor.position);
            player.position.x+=Math.cos(yaw)*2;
            player.position.z-=Math.sin(yaw)*2;
            player.visible=true;
        }else if(player.position.distanceTo(tractor.position)<EINSTEIGEN_ABSTAND){
            // Repariert: Einsteigen geht nur, wenn du beim Traktor stehst
            driving=true;
            player.visible=false;
        }
        updateHUD();
    }

    if(e.key.toLowerCase()==='b') buildMode();

    if(e.key.toLowerCase()==='r') rotation+=Math.PI/4;

    if(e.key===' ') speed=0;
});

document.addEventListener('keyup',e=>{
    keys[e.key.toLowerCase()]=false;
});

let mouseDown=false;
renderer.domElement.addEventListener('mousedown',()=>mouseDown=true);
document.addEventListener('mouseup',()=>mouseDown=false);
document.addEventListener('mousemove',e=>{
    if(mouseDown){
        yaw-=e.movementX*0.004;
        pitch=Math.max(-0.2,Math.min(0.9,pitch+e.movementY*0.003));
    }
});

renderer.domElement.addEventListener('click',e=>{
    if(!building)return;

    const raycaster=new THREE.Raycaster();
    const pointer=new THREE.Vector2(
        e.clientX/innerWidth*2-1,
        -(e.clientY/innerHeight)*2+1
    );
    raycaster.setFromCamera(pointer,camera);
    const hit=raycaster.intersectObject(ground);

    if(hit.length && money>=10000){
        const building=new THREE.Mesh(
            new THREE.BoxGeometry(8,5,8),
            new THREE.MeshStandardMaterial({color:0xaaaaaa})
        );
        building.position.copy(hit[0].point);
        building.position.y=2.5;
        building.rotation.y=rotation;
        scene.add(building);
        money-=10000;
        updateHUD();
    }
});

const clock=new THREE.Clock();

function animate(){
    requestAnimationFrame(animate);
    const dt=Math.min(clock.getDelta(),0.05);

    if(driving){
        if(keys.w) speed=Math.min(speed+12*dt,20);
        else if(keys.s) speed=Math.max(speed-12*dt,-8);
        else speed*=0.96;

        if(keys.a) tractor.rotation.y+=1.5*dt;
        if(keys.d) tractor.rotation.y-=1.5*dt;

        if(keys[' ']) speed=0;

        tractor.translateZ(-speed*dt);
        zeigeHinweis('');
    }else{
        // Repariert: "Vorne" ist weg von der Kamera (vorher lief man mit W rückwärts)
        const forward=new THREE.Vector3(
            -Math.sin(yaw),0,-Math.cos(yaw)
        );
        const right=new THREE.Vector3(
            Math.cos(yaw),0,-Math.sin(yaw)
        );
        if(keys.w) player.position.addScaledVector(forward,10*dt);
        if(keys.s) player.position.addScaledVector(forward,-10*dt);
        if(keys.a) player.position.addScaledVector(right,-10*dt);
        if(keys.d) player.position.addScaledVector(right,10*dt);
        player.rotation.y=yaw;
        zeigeHinweis(player.position.distanceTo(tractor.position)<EINSTEIGEN_ABSTAND?'🚜 E drücken zum Einsteigen':'');
    }

    const target=driving?tractor.position:player.position;
    const angle=driving?tractor.rotation.y:yaw;
    const distance=driving?9:7;
    const height=driving?5:4;

    camera.position.set(
        target.x+Math.sin(angle)*distance,
        target.y+height+pitch*3,
        target.z+Math.cos(angle)*distance
    );
    camera.lookAt(target.x,target.y+1,target.z);

    renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
